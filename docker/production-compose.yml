services:
    production-imageai:
        build:
            context: ../
            dockerfile: docker/Dockerfile
            args:
                - ENV_FILE=.env.production
        image: production-imageai
        ports:
            - '3003:3000'
        volumes:
            - ~/secrets/imageai/.env.production:/app/.env.production:ro
        environment:
            - NODE_ENV=production
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
