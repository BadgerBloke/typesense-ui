name: Prod Deployment
on:
    push:
        branches:
            - super-trunk # Replace this with the branch needs to be deployed in production
jobs:
    deploy:
        runs-on: self-hosted # Uses your self-hosted runner on EC2
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build and start production
              run: |
                  # Stop any existing containers
                  make stop-production || true

                  # Build the production image
                  make build-production

                  # Start the production containers
                  make start-production

            - name: Wait for services to stabilize
              run: sleep 30s

            - name: Verify services are running
              run: docker compose -f docker/production-compose.yml ps

            - name: Check application health
              run: |
                  # Wait for the application to be available
                  max_attempts=10
                  attempt=1

                  while [ $attempt -le $max_attempts ]; do
                    if curl -s -f -o /dev/null https://imageai.io/api/health; then
                      echo "Application is healthy!"
                      break
                    fi
                    
                    echo "Waiting for application to become available (attempt $attempt/$max_attempts)..."
                    sleep 10
                    attempt=$((attempt+1))
                  done

                  if [ $attempt -gt $max_attempts ]; then
                    echo "Application failed to become healthy after $max_attempts attempts"
                    docker compose -f docker/production-compose.yml logs
                    exit 1
                  fi

            - name: Clean up
              run: |
                  docker system prune -af --volumes
                  docker image prune -af
              continue-on-error: true

